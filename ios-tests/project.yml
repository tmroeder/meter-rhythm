name: MeterRhythmIOS
options:
  bundleIdPrefix: local.meterrhythm
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  Host:
    type: application
    platform: iOS
    sources: [Host]
    info:
      path: Host/Info.plist
      properties:
        UILaunchScreen: {}
  UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Host
    info:
      path: UITests/Info.plist
schemes:
  UITests:
    build:
      targets:
        Host: all
        UITests: [test]
    test:
      targets: [UITests]
